<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            clifford: '#da373d',
          }
        }
      }
    }
  </script>

    <title>Portfolio Website - by Idowu Fasunle</title>
  </head>
  <body
    class="flex flex-col items-center bg-slate-400 text-blue-900 text-2xl text-extra-bold p-4 text-center min-h-screen font-serif"
  >
    <div
      class="max-w-3xl mx-auto my-4 rounded-lg shadow-sm p-6 hover:shadow-lg transition-shadow duration-300"
    >
      <h1 class="text-white text-2xl font-extrabold">My Personal Gallery</h1>
      <p>
        Welcome to
        <a
          href="_blank https://github.com/idowufasunle"
          class="text-bold text-2xl text-blue-500"
          >Idowu Fasunle</a
        >'s gallery!
      </p>
      <p>Get a view of my personal collection</p>
    </div>

    <div
      id="galleryImages"
      class="max-w-sm aspect-square m-auto rounded-lg border-stone-200 border overflow-hidden hover:scale-105 transition-transform duration-300 shadow-lg shadow-stone-400"
    >
      <img src="./Images/selfieOnCap.JPG" alt="Selfie on Cap" />
    </div>

    <div class="grid grid-cols-2 justify-items-center gap-4 mt-8">
      <div
        id="galleryImages"
        class="max-w-[200px] aspect-square rounded-lg border-stone-200 border overflow-hidden hover:scale-105 transition-transform duration-300 shadow-lg shadow-stone-400"
      >
        <img src="./Images/selfieWithSammy.JPG" alt="Selfie with Sammy" />
      </div>

      <div
        id="galleryImages"
        class="max-w-[200px] aspect-square rounded-lg border-stone-200 border overflow-hidden hover:scale-105 transition-transform duration-300 shadow-lg shadow-stone-400"
      >
        <img
          class="border-stone-100 border rounded-lg"
          src="./Images/matriculationImage.JPG"
          alt="matriculation Image"
        />
      </div>

      <div
        id="galleryImages"
        class="max-w-[200px] aspect-square rounded-lg border-stone-200 border overflow-hidden hover:scale-105 transition-transform duration-300 shadow-lg shadow-stone-400"
      >
        <img src="./Images/Wizkid.JPG" alt="Wizkid" />
      </div>

      <div
        id="galleryImages"
        class="max-w-[200px] aspect-square rounded-lg border-stone-200 border overflow-hidden hover:scale-105 transition-transform duration-300 shadow-lg shadow-stone-400"
      >
        <img src="./Images/erlingHaaland.JPG" alt="Erling Haaland" />
      </div>
    </div>

    <div
      id="lightbox"
      class="lightbox flex items-center justify-center flex-col fixed top-0 right-0 w-full h-full bg-black bg-opacity-75 hidden z-10 transition-opacity duration-300"
    >
      <img
        class="max-w-[70vw] max-h-[80vh] rounded-lg shadow-lg"
        id="lightbox-img"
        src="./Images/erlingHaaland.JPG"
        alt="Enlarged view"
      />
      <span
        id="closeBtn"
        class="hover:cursor-pointer static text-red-300 text-5xl shadow-lg mx-2 rounded-lg p-2 hover:text-6xl duration-300"
        >&times;</span
      >
    </div>

    <script src="./main.js"></script>
  </body>
</html>
